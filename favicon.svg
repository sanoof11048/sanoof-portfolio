        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- High-contrast crisp center core line -->
  <path d="M 328 154 
           C 328 154 302 126 256 126 
           C 208 126 172 156 172 198 
           C 172 236 210 254 262 268 
           C 318 284 344 310 344 366 
           C 344 414 312 442 256 442 
           C 208 442 172 414 172 414" 
