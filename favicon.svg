<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e183a" />
      <stop offset="100%" stop-color="#0b0819" />
    </linearGradient>
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="35%" stop-color="#a855f7" />
      <stop offset="70%" stop-color="#7843e8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7843e8" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Dark Rounded Squircle Base -->
  <rect x="28" y="28" width="456" height="456" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="16" />

  <!-- Bold Monogram 'S' perfectly centered -->
  <path d="M 346 156 
           C 346 156 316 108 256 108 
           C 192 108 148 150 148 202 
