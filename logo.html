<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery Practice</title>
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .section {
            margin-bottom: 30px;
        }
        .box {
            width: 100px;
            height: 100px;
            background-color: lightblue;
            margin: 10px 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        button {
            padding: 5px 15px;
            margin: 5px;
        }
    </style>
</head>
<body>
    
    <h1>jQuery Learning Playground</h1>

    <!-- Counter Section -->
    <div class="section">
        <h2>Counter</h2>
        <button class="sub">-</button>
        <button class="count">0</button>
        <button class="add">+</button>
    </div>

    <!-- Show / Hide Section -->
    <div class="section">
        <h2>Show / Hide Box</h2>
        <button class="hideBox">Hide</button>
        <button class="showBox">Show</button>
        <button class="toggleBox">Toggle</button>
        <div class="box" id="myBox">Box</div>
    </div>

    <!-- Text / HTML Section -->
    <div class="section">
        <h2>Change Text / HTML</h2>
        <p id="para">This is a paragraph.</p>
        <button class="changeText">Change Text</button>
        <button class="changeHTML">Change HTML</button>
    </div>

    <!-- CSS Section -->
    <div class="section">
        <h2>Change CSS</h2>
        <div class="box myClass">CSS Box</div>
        <button class="cssBtn">Apply CSS</button>
    </div>

    <!-- Form Section -->
    <div class="section">
        <h2>Form Input</h2>
        <input type="text" id="myInput" placeholder="Type something">
        <button class="getVal">Get Value</button>
        <button class="setVal">Set Value</button>
        <p id="inputResult"></p>
    </div>

    <!-- Animation Section -->
    <div class="section">
        <h2>Animation</h2>
        <button class="fadeInBtn">Fade In</button>
        <button class="fadeOutBtn">Fade Out</button>
        <button class="slideDownBtn">Slide Down</button>
        <button class="slideUpBtn">Slide Up</button>
        <div class="box" id="animBox">Animate Me</div>
    </div>

    <script>
        // Counter
        $(".add").on("click", function() {
            let current = parseInt($(".count").text());
            $(".count").text(current + 1);
        });
        $(".sub").on("click", function() {
            let current = parseInt($(".count").text());
            if(current > 0) $(".count").text(current - 1);
        });

        // Show / Hide
        $(".hideBox").click(() => $("#myBox").hide());
        $(".showBox").click(() => $("#myBox").show());
        $(".toggleBox").click(() => $("#myBox").toggle());

        // Change Text / HTML
        $(".changeText").click(() => $("#para").text("Text has been changed!"));
        $(".changeHTML").click(() => $("#para").html("<b>HTML has been changed!</b>"));

        // CSS
        $(".cssBtn").click(() => $(".myClass").css({
            "background-color": "pink",
            "color": "white",
            "font-weight": "bold",
            "border-radius": "10px"
        }));

        // Form Input
        $(".getVal").click(() => {
            let val = $("#myInput").val();
            $("#inputResult").text("You typed: " + val);
        });
        $(".setVal").click(() => {
            $("#myInput").val("Hello jQuery!");
        });

        // Animation
        $(".fadeInBtn").click(() => $("#animBox").fadeIn());
        $(".fadeOutBtn").click(() => $("#animBox").fadeOut());
        $(".slideDownBtn").click(() => $("#animBox").slideDown());
        $(".slideUpBtn").click(() => $("#animBox").slideUp());
    </script>
</body>
</html>
